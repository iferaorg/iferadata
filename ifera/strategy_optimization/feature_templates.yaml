    - smooth_k
    - smooth_d
    - component
    - days_ago
  cci:
    type: continuous
    category: any
    min_value: -300
    max_value: 300
    granularity: 0.01
    parameters:
    - days
    - days_ago
  adx:
    type: continuous
    category: any
    min_value: 0
    max_value: 100
    granularity: 0.01
    parameters:
    - days
    - days_ago
  momentum:
